server.address=127.0.0.1
server.port=8098
server.servlet.session.cookie.same-site=strict
spring.config.import=optional:file:./config/laragon-local.properties
spring.datasource.url=${SOLOP_DB_URL:jdbc:mysql://127.0.0.1:3306/solop_enterprise?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh&useAffectedRows=false}
spring.datasource.username=${SOLOP_DB_USER:solop_app}
spring.datasource.password=${SOLOP_DB_PASSWORD:Solop2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
