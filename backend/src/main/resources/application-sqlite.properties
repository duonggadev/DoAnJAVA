# Rollback-only profile. The default application now runs on MySQL.
# Activate explicitly with --spring.profiles.active=sqlite to use the original SQLite backup.
spring.datasource.url=jdbc:sqlite:${SO_LOP_DB:./data/so-lop.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.schema-locations=classpath:schema.sql
